<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Entrenador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="marca">
      <span class="punto"></span>
      <h1 id="titulo">Entrenador</h1>
      <span class="chip-modo" id="chipModo" hidden></span>
      <button class="icon-btn" id="btnMenu" title="Opciones" aria-label="Opciones">⋯</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
  <div class="aviso-previa" id="avisoPrevia" hidden></div>
</header>

<main id="app"><div class="vacio">Cargando…</div></main>

<div class="timer" id="timer" role="timer" aria-live="polite">
  <b id="timerVal">0:00</b>
  <button class="btn ghost sm" data-t="-15">−15</button>
  <button class="btn ghost sm" data-t="15">+15</button>
  <button class="btn sm" data-t="0">Saltar</button>
</div>

<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
